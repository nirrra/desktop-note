<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: staging-image:; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面便签</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="app" data-theme="gray" data-layout="compact" data-edge="" style="--panel-alpha: 0.92">
      <section class="widget-shell" aria-label="桌面便签">
        <header class="title-bar">
          <div class="drag-surface" title="拖动组件；靠近屏幕边缘会自动隐藏">
            <time id="todayDate" datetime="2026-08-12">8月12日 周三</time>
          </div>

          <nav class="workspace-tabs" aria-label="工作区">
            <button id="itemsTab" class="workspace-tab is-active" type="button" aria-selected="true">
              <span>待办</span><small id="itemCount">0</small>
            </button>
            <button id="stagingTab" class="workspace-tab" type="button" aria-selected="false">
              <span>暂存</span><small id="stagingCount">0</small>
            </button>
          </nav>

          <div class="title-actions">
            <button id="pinButton" class="title-button" type="button" aria-label="始终置顶" title="始终置顶" aria-pressed="true">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10.2 3.2 16 9l-1.3 1.3-1.5-.3-3.2 3.2v3.6l-1.6-1.6v-2L5.2 9.9l-.3-1.5L6.2 7.1Z" /><path d="m7.4 12.2-3.2 3.2" /></svg>
            </button>
            <button id="settingsButton" class="title-button" type="button" aria-label="打开设置" title="设置">
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.45" /><path d="M8.15 2.75h3.7l.38 1.78 1.58.65 1.5-.92 1.85 1.85-.92 1.5.65 1.58 1.78.38v3.7l-1.78.38-.65 1.58.92 1.5-1.85 1.85-1.5-.92-1.58.65-.38 1.78H8.15l-.38-1.78-1.58-.65-1.5.92-1.85-1.85.92-1.5-.65-1.58L2.33 11.85V8.15l1.78-.38.65-1.58-.92-1.5 1.85-1.85 1.5.92 1.58-.65.38-1.78Z" /></svg>
            </button>
            <button id="hideButton" class="title-button" type="button" aria-label="隐藏到托盘" title="最小化">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10.5h10" /></svg>
            </button>
            <button id="closeButton" class="title-button close-button" type="button" aria-label="隐藏到托盘" title="关闭">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 6 8 8m0-8-8 8" /></svg>
            </button>
          </div>
        </header>

        <div class="workspace-stack">
          <section id="itemsWorkspace" class="workspace-view" aria-label="待办工作区">
            <div class="list-pane">
              <section id="itemsList" class="items-list" aria-label="待办列表"></section>

              <div id="emptyState" class="empty-state" hidden>
                <span class="empty-line" aria-hidden="true"></span>
                <strong>暂无待办</strong>
              </div>
            </div>

            <label class="list-composer item-composer">
              <input id="itemComposerInput" type="text" maxlength="1000" placeholder="输入便签内容，回车添加" autocomplete="off" spellcheck="false" />
              <button id="addItem" type="button" aria-label="新建待办" title="新建待办 (Ctrl+N)">
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5.2v9.6M5.2 10h9.6" /></svg>
                <span class="composer-hint" aria-hidden="true">Enter 添加</span>
              </button>
            </label>
          </section>

          <section id="stagingWorkspace" class="workspace-view staging-workspace" aria-label="暂存工作区" hidden>
            <div class="list-pane">
              <section id="stagingList" class="staging-list" aria-label="暂存列表"></section>

              <div id="stagingEmpty" class="staging-empty" hidden>
                <span class="staging-empty-mark" aria-hidden="true">T</span>
                <strong>暂存区还是空的</strong>
                <small>粘贴内容，或拖入图片和文件</small>
              </div>
            </div>

            <div class="staging-footer">
              <button id="pasteStaging" class="dropzone-action" type="button" title="读取当前剪贴板" aria-label="粘贴到暂存区">
                <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2" /><path d="M10 6.6v6.8M6.6 10h6.8" /></svg>
              </button>
              <span class="dropzone-copy">粘贴内容或拖入文件到此处 (Ctrl+V)</span>
              <button id="clearStaging" class="clear-staging" type="button">清空</button>
              <button id="addStaging" class="dropzone-action" type="button" aria-label="添加文件到暂存区" title="添加文件到暂存区">
                <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.4" y="5" width="13.2" height="10.4" rx="1.8" /><path d="m6.2 12.4 2.4-2.6 2.2 2.1 2.4-3.1 2.6 3.6" /><circle cx="7.4" cy="8.1" r="1" /></svg>
              </button>
            </div>
          </section>
        </div>
      </section>

      <button id="edgeHandle" class="edge-handle" type="button" aria-label="展开桌面便签">
        <span></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m5 3 5 5-5 5" /></svg>
      </button>

      <section id="settingsPanel" class="overlay-panel" aria-label="设置" hidden>
        <header class="overlay-header">
          <strong>设置</strong>
          <button class="overlay-close" type="button" data-close-panel aria-label="关闭设置">×</button>
        </header>

        <div class="settings-content">
            <section id="settingsAppearance" class="settings-section">
              <div class="setting-block theme-setting">
                <span class="setting-label">主题皮肤</span>
                <div class="theme-grid" role="radiogroup" aria-label="选择皮肤">
                  <button type="button" data-theme-choice="gray" title="中性灰极简"><i></i><span>中性灰</span></button>
                  <button type="button" data-theme-choice="paper" title="暖白纸感"><i></i><span>暖白纸</span></button>
                  <button type="button" data-theme-choice="graphite" title="深色石墨"><i></i><span>石墨</span></button>
                  <button type="button" data-theme-choice="glass" title="雾面玻璃"><i></i><span>雾面</span></button>
                  <button type="button" data-theme-choice="editorial" title="黑白编辑风"><i></i><span>编辑</span></button>
                  <button type="button" data-theme-choice="wabi" title="自然侘寂风"><i></i><span>侘寂</span></button>
                </div>
              </div>

              <div class="setting-block opacity-block">
                <span class="setting-label">透明度</span>
                <label class="opacity-row" for="opacityInput">
                  <span>透明</span>
                  <input id="opacityInput" type="range" min="50" max="100" step="1" value="92" />
                  <span>不透明</span>
                  <output id="opacityValue" for="opacityInput">92%</output>
                </label>
                <p class="setting-tip">调整窗口背景透明度，打造轻盈的悬浮体验。</p>
              </div>

              <div class="setting-block font-block">
                <span class="setting-label">字体大小</span>
                <label class="opacity-row" for="fontSizeInput">
                  <span>小</span>
                  <input id="fontSizeInput" type="range" min="12" max="20" step="1" value="13" />
                  <span>大</span>
                  <output id="fontSizeValue" for="fontSizeInput">13px</output>
                </label>
              </div>
            </section>

            <section id="settingsBehavior" class="settings-section">
              <div class="setting-block">
                <span class="setting-label">组件大小</span>
                <div class="setting-row size-row">
                  <label><span>宽</span><input id="widthInput" type="number" min="320" max="640" step="10" value="420" /><small>px</small></label>
                  <span class="multiply">×</span>
                  <label><span>高</span><input id="heightInput" type="number" min="280" max="640" step="10" value="340" /><small>px</small></label>
                  <button id="applySize" type="button">应用</button>
                </div>
                <p class="setting-hint">修改组件尺寸后将应用到主窗口。</p>
              </div>

              <label class="setting-row toggle-row pin-row" for="pinToggle">
                <span class="setting-copy">
                  <span class="setting-label">始终置顶</span>
                  <small>保持便签浮在其他窗口之上</small>
                </span>
                <input id="pinToggle" type="checkbox" checked />
                <span class="switch" aria-hidden="true"><i></i></span>
              </label>

              <label class="setting-row toggle-row startup-row" for="launchAtLoginToggle">
                <span class="setting-copy">
                  <span class="setting-label">开机自启动</span>
                  <small id="launchAtLoginHint" aria-live="polite">登录 Windows 后自动打开</small>
                </span>
                <input id="launchAtLoginToggle" type="checkbox" aria-describedby="launchAtLoginHint" disabled />
                <span class="switch" aria-hidden="true"><i></i></span>
              </label>
            </section>

            <section id="settingsAbout" class="settings-section">
              <div class="setting-block about-block">
                <span class="setting-label">关于</span>
                <strong>桌面便签 0.3.22</strong>
                <p>待办与图文暂存工作区。内容只保存在本机，不会上传。</p>
              </div>
            </section>
        </div>
      </section>

      <section id="schedulePanel" class="overlay-panel schedule-panel" aria-label="设置时间" hidden>
        <header class="overlay-header">
          <strong>设置时间</strong>
          <button class="overlay-close" type="button" data-close-panel aria-label="关闭时间设置">×</button>
        </header>

        <div class="schedule-content">
          <div id="datetimeField" class="schedule-field">
            <div class="datetime-inputs">
              <div class="schedule-picker">
                <span>日期</span>
                <button id="datePickerButton" class="picker-trigger is-empty" type="button" aria-haspopup="dialog" aria-expanded="false">
                  <svg class="picker-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="1.6" /><path d="M2.5 6.5h11M6 2.5v2.2M10 2.5v2.2" /></svg>
                  <span id="datePickerLabel">不设置</span>
                </button>
                <input id="datetimeDateInput" class="picker-native" type="date" tabindex="-1" aria-hidden="true" />
                <div id="datePickerPanel" class="picker-panel" hidden>
                  <div class="calendar-nav">
                    <button type="button" id="datePickerPrev" aria-label="上个月">‹</button>
                    <strong id="datePickerMonth"></strong>
                    <button type="button" id="datePickerNext" aria-label="下个月">›</button>
                  </div>
                  <div class="calendar-weekdays" aria-hidden="true">
                    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                  </div>
                  <div id="datePickerDays" class="calendar-days"></div>
                  <button type="button" id="clearDate" class="picker-clear"><span aria-hidden="true">×</span>不设置</button>
                </div>
              </div>
              <div class="schedule-picker">
                <span>时间</span>
                <div class="time-trigger-wrap">
                  <svg class="picker-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.2" /><path d="M8 5.2v3.1l2.1 1.2" /></svg>
                  <input
                    id="timeTextInput"
                    class="direct-time-input"
                    type="text"
                    inputmode="numeric"
                    maxlength="5"
                    placeholder="不设置"
                    autocomplete="off"
                    spellcheck="false"
                  />
                </div>
                <div id="timePickerPanel" class="picker-panel time-picker-panel" hidden>
                  <div class="time-columns">
                    <div id="timeHourList" class="time-col" role="listbox" aria-label="时"></div>
                    <div id="timeMinuteList" class="time-col" role="listbox" aria-label="分"></div>
                  </div>
                  <button type="button" id="clearTime" class="picker-clear"><span aria-hidden="true">×</span>不设置</button>
                </div>
              </div>
            </div>
          </div>

          <footer class="schedule-actions">
            <button type="button" data-close-panel>取消</button>
            <button id="saveSchedule" class="primary-action" type="button">保存</button>
          </footer>
        </div>
      </section>

      <div id="dropOverlay" class="drop-overlay" hidden>
        <span aria-hidden="true">＋</span>
        <strong>松开即可暂存</strong>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <template id="itemTemplate">
        <article class="item-row">
          <button class="reorder-handle" type="button" draggable="true" aria-label="拖动调整优先级" title="拖动排序；Alt+↑/↓ 也可移动">
            <span aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          </button>
          <label class="item-check">
            <input class="item-done" type="checkbox" />
            <span aria-hidden="true"></span>
          </label>
          <textarea class="item-editor" rows="1" maxlength="1000" placeholder="输入待办…"></textarea>
          <button class="schedule-button" type="button" aria-label="设置时间" title="设置时间">
            <span class="time-main"></span>
          </button>
          <button class="delete-button" type="button" aria-label="删除待办" title="删除待办">
            <svg class="icon-x" viewBox="0 0 16 16" aria-hidden="true"><path d="m4.2 4.2 7.6 7.6m0-7.6-7.6 7.6" /></svg>
            <svg class="icon-trash" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 4.2h9.2M6.2 4.2V3.1h3.6v1.1M5.1 4.2v8.2c0 .6.4 1.1 1 1.1h3.8c.6 0 1-.5 1-1.1V4.2" /></svg>
            <span class="delete-confirm" aria-hidden="true">!</span>
          </button>
        </article>
      </template>

      <template id="stagingItemTemplate">
        <article class="staging-row">
          <button class="reorder-handle staging-reorder" type="button" draggable="true" aria-label="拖动调整暂存顺序" title="拖动排序；Alt+↑/↓ 也可移动">
            <span aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          </button>
          <button class="staging-visual" type="button" aria-label="预览图片">
            <img class="staging-thumbnail" alt="" />
            <span class="staging-text-mark" aria-hidden="true">T</span>
          </button>
          <div class="staging-content">
            <div class="staging-title-row">
              <span class="staging-tag"></span>
              <strong class="staging-image-name"></strong>
            </div>
            <textarea class="staging-text-editor" rows="1" maxlength="5000" placeholder="输入暂存文字…"></textarea>
            <small class="staging-meta"></small>
          </div>
          <div class="staging-actions">
            <button class="staging-preview" type="button" aria-label="预览" title="预览">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.8 8s2.4-4.2 6.2-4.2S14.2 8 14.2 8s-2.4 4.2-6.2 4.2S1.8 8 1.8 8Z" /><circle cx="8" cy="8" r="1.8" /></svg>
            </button>
            <button class="staging-copy" type="button" aria-label="复制暂存项" title="复制">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.4" y="3.2" width="7.2" height="8.2" rx="1.3" /><path d="M10.4 12.8H4.8A1.4 1.4 0 0 1 3.4 11.4V6.2" /></svg>
            </button>
            <button class="staging-save" type="button" aria-label="另存" title="另存">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v7.2m0 0 2.6-2.6M8 10.4 5.4 7.8M3.2 12.6h9.6" /></svg>
            </button>
            <button class="staging-delete" type="button" aria-label="删除暂存项" title="删除暂存项">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.4 4.2h9.2M6.2 4.2V3.1h3.6v1.1M5.1 4.2v8.2c0 .6.4 1.1 1 1.1h3.8c.6 0 1-.5 1-1.1V4.2" /></svg>
              <span aria-hidden="true">!</span>
            </button>
          </div>
        </article>
      </template>
    </main>
    <script src="app.js"></script>
  </body>
</html>
